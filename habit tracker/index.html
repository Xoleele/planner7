<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Habit Tracker</title>
  <link rel="icon" href="icons/target.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="launcher" id="launcher" hidden>
    <button class="open-tracker" id="open-tracker">Abrir Habit Tracker</button>
  </main>
  <section class="modal-backdrop" id="tracker-backdrop">
    <div class="modal-content tracker" role="dialog" aria-modal="true" aria-labelledby="tracker-title">
      <header class="modal-header">
        <h1 id="tracker-title">Habit Tracker</h1>
        <div class="modal-header-actions">
          <button class="icon-button" id="show-stats" aria-label="Ver estadísticas" title="Estadísticas">
            <img src="icons/bar-chart.svg" alt="">
          </button>
          <button class="icon-button" id="close-tracker" aria-label="Cerrar Habit Tracker" title="Cerrar">
            <img src="icons/close.svg" alt="">
          </button>
        </div>
      </header>
      <div class="tracker-body">
        <div class="habit-headings" id="habit-headings" aria-label="Hábitos"></div>
        <div class="history">
          <div class="history-viewport" id="history-viewport" tabindex="0" aria-label="Registro de hábitos, del día más reciente al más antiguo">
            <div class="habit-grid" id="habit-grid"></div>
          </div>
          <div class="scroll-rail" aria-hidden="true">
            <button class="scroll-arrow up" id="scroll-up" tabindex="-1" aria-label="Subir fechas"></button>
            <div class="scroll-track" id="scroll-track"><div class="scroll-thumb" id="scroll-thumb"></div></div>
            <button class="scroll-arrow down" id="scroll-down" tabindex="-1" aria-label="Bajar fechas"></button>
          </div>
        </div>
      </div>
    </div>
  </section>
  <dialog class="stats-dialog" id="stats-dialog" aria-labelledby="stats-title">
    <header class="stats-header">
      <h2 id="stats-title">Estadísticas</h2>
      <button class="icon-button" id="close-stats" aria-label="Cerrar estadísticas"><img src="icons/close.svg" alt=""></button>
    </header>
    <p class="stats-period" id="stats-period"></p>
    <div id="stats-list"></div>
  </dialog>
  <dialog class="stats-dialog habit-editor" id="habit-editor" aria-labelledby="habit-editor-title">
    <form id="habit-form">
      <header class="stats-header">
        <h2 id="habit-editor-title">Editar hábito</h2>
        <div class="modal-header-actions">
          <button class="icon-button delete-habit" id="delete-habit" type="button" title="Eliminar hábito" aria-label="Eliminar hábito"><img src="icons/trash.svg" alt=""></button>
          <button class="icon-button" id="close-editor" type="button" aria-label="Cerrar editor"><img src="icons/close.svg" alt=""></button>
        </div>
      </header>
      <label class="field-label" for="habit-name">Nombre</label>
      <input class="habit-input" id="habit-name" name="name" maxlength="60" required autocomplete="off" placeholder="Nombre del hábito">
      <fieldset class="icon-fieldset">
        <legend class="field-label">Icono</legend>
        <div class="icon-picker" id="icon-picker"></div>
      </fieldset>
      <footer class="editor-actions">
        <div class="editor-save-actions">
          <button class="form-button" id="cancel-editor" type="button">Cancelar</button>
          <button class="form-button primary" type="submit" id="save-habit">Guardar</button>
        </div>
      </footer>
    </form>
  </dialog>
  <div class="sr-only" id="announcement" role="status" aria-live="polite"></div>
</body>
</html>
